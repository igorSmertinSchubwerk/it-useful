server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Only the private Docker bridge peer may supply the forwarding headers.
      internal-proxies: "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"
  servlet:
    session:
      timeout: 30m
      cookie:
        name: IT_USEFUL_SESSION
        http-only: true
        secure: true
        same-site: lax

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    public-base-url: ${APP_PUBLIC_BASE_URL}
    owner-github-id: ${APP_OWNER_GITHUB_ID}
    github-client-id: ${GITHUB_CLIENT_ID}
    github-client-secret: ${GITHUB_CLIENT_SECRET}
