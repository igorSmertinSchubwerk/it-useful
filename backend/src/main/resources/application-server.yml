server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Only the private Docker bridge peer may supply the forwarding headers.
      internal-proxies: "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"
  servlet:
    session:
      timeout: 30m
      cookie:
        name: IT_USEFUL_SESSION
        http-only: true
        secure: true
        same-site: lax

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    public-base-url: ${APP_PUBLIC_BASE_URL}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:25}
    from: ${SMTP_FROM:}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    starttls: ${SMTP_STARTTLS:true}
