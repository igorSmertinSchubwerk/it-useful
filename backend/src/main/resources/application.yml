spring:
  application:
    name: it-useful-backend
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:it_useful}
    username: ${DB_USER:it_useful}
    password: ${DB_PASSWORD:it_useful_local}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    factory:
      constraints:
        read:
          max-document-length: 400000
          max-name-length: 100
          max-nesting-depth: 20
          max-number-length: 20
          max-string-length: 60000
          max-token-count: 200

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: none
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 12MB
    max-parameter-count: 16
    max-part-count: 4
    max-part-header-size: 512B
    max-swallow-size: 12MB
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  storage:
    directory: ${UPLOAD_DIR:../uploads}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:10485760}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
