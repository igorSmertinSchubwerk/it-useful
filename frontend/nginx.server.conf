# Every connection arrives from the Docker bridge, which in production is the
# host's public nginx. That proxy replaces X-Forwarded-For with the visitor's
# address, so the rate limits below apply per visitor instead of to everyone.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

limit_req_zone $binary_remote_addr zone=it_useful_api:1m rate=20r/s;
# Sign-in gets its own slow lane so password guessing stays expensive.
limit_req_zone $binary_remote_addr zone=it_useful_sign_in:1m rate=10r/m;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /api/session/login {
        limit_req zone=it_useful_sign_in burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy-server.conf;
    }

    location /api/ {
        limit_req zone=it_useful_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy-server.conf;
    }

    location = /logout {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy-server.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
