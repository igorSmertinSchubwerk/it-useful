services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-it_useful}
      POSTGRES_USER: ${DB_USER:-it_useful}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-it_useful_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: container
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-it_useful}
      DB_USER: ${DB_USER:-it_useful}
      DB_PASSWORD: ${DB_PASSWORD:-it_useful_local}
      BACKEND_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-12MB}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-10485760}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
