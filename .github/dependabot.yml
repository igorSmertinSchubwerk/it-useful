version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    ignore:
      # Java majors stay on the LTS line in .java-version and change deliberately.
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major
      # The maven tag embeds the Java major, and the floating 3.9 tag gets patches on rebuild.
      - dependency-name: maven

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
