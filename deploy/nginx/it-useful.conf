# Public entry point for IT Useful on a host whose nginx already serves other
# sites. It adds one server block for this domain and changes nothing else.
# Install it and let certbot add TLS and the HTTP-to-HTTPS redirect, as
# described in docs/SERVER_RUNBOOK.md.
server {
    listen 80;
    listen [::]:80;
    server_name it-useful.schubwerk.tech;

    # Matches the stack's own request limit, which returns the precise error.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replaces any client-supplied value, so the stack's per-visitor rate
        # limits cannot be dodged with a forged header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
