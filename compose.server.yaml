services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the validated server environment file}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in the validated server environment file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the validated server environment file}

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: container,server
      DB_NAME: ${DB_NAME:?Set DB_NAME in the validated server environment file}
      DB_USER: ${DB_USER:?Set DB_USER in the validated server environment file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the validated server environment file}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?Set APP_PUBLIC_BASE_URL in the validated server environment file}
      APP_OWNER_GITHUB_ID: ${APP_OWNER_GITHUB_ID:?Set APP_OWNER_GITHUB_ID in the validated server environment file}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in the validated server environment file}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in the validated server environment file}

  frontend:
    build:
      args:
        VITE_API_BASE_URL: /api
        VITE_AUTHENTICATION: server
        NGINX_CONFIG: nginx.server.conf
    ports: !override
      - target: 8080
        published: ${FRONTEND_PORT:-3000}
        host_ip: 127.0.0.1
        protocol: tcp
